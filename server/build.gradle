// Use the buildscript block with the Maven Central fork of the Shadow plugin
// (io.github.goooler.shadow) so no access to plugins-artifacts.gradle.org is needed.
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'io.github.goooler.shadow:shadow-gradle-plugin:8.1.8'
    }
}

apply plugin: 'java'
apply plugin: 'io.github.goooler.shadow'

group   = 'jadx'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    // Required for com.android.tools.smali:smali-baksmali (transitive dep of jadx-dex-input)
    // and other Android tooling pulled in transitively by jadx-dex-input.
    google()
}

dependencies {
    // https://central.sonatype.com/artifact/io.github.skylot/jadx-core
    implementation 'io.github.skylot:jadx-core:1.5.4'

    // jadx-core is the decompiler engine only; jadx-dex-input registers the
    // ServiceLoader-based reader for DEX files and their wrappers (APK, ZIP).
    // Without this, JadxDecompiler.load() finds no classes when given an APK.
    // mergeServiceFiles() in shadowJar ensures the registration survives JAR merging.
    implementation 'io.github.skylot:jadx-dex-input:1.5.4'

    // https://central.sonatype.com/artifact/org.eclipse.lsp4j/org.eclipse.lsp4j
    implementation 'org.eclipse.lsp4j:org.eclipse.lsp4j:0.24.0'

    // Routes jadx-core's SLF4J logging to stderr so it doesn't touch stdout.
    implementation 'org.slf4j:slf4j-simple:2.0.17'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// jadx-dex-input has a transitive dependency on smali-baksmali, which lives on
// dl.google.com (Google Maven). That host is not required for any test we run,
// so exclude it from the test classpath to keep `gradle test` self-contained.
// The shadowJar task still bundles jadx-dex-input via runtimeClasspath.
configurations.testRuntimeClasspath {
    exclude group: 'io.github.skylot', module: 'jadx-dex-input'
}

jar {
    manifest {
        attributes 'Main-Class': 'jadx.lsp.Main'
    }
}

shadowJar {
    archiveBaseName.set('jadx-lsp')
    archiveVersion.set('')
    archiveClassifier.set('')
    mergeServiceFiles()  // merges META-INF/services so jadx's plugin loader works
}

build.dependsOn shadowJar
