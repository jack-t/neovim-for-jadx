// Use the buildscript block with the Maven Central fork of the Shadow plugin
// (io.github.goooler.shadow) so no access to plugins-artifacts.gradle.org is needed.
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'io.github.goooler.shadow:shadow-gradle-plugin:8.1.8'
    }
}

apply plugin: 'java'
apply plugin: 'io.github.goooler.shadow'

group   = 'jadx'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenLocal()
    mavenCentral()
    // Required for com.android.tools.smali:smali-baksmali (transitive dep of jadx-dex-input)
    // and other Android tooling pulled in transitively by jadx-dex-input.
    // google() is blocked in this environment; smali artifacts are pre-built locally.
}

sourceSets {
    integrationTest {
        java.srcDir 'src/integrationTest/java'
        resources.srcDir 'src/integrationTest/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

tasks.matching { it.name == 'processIntegrationTestResources' }.configureEach {
    duplicatesStrategy = 'include'
}

dependencies {
    // https://central.sonatype.com/artifact/io.github.skylot/jadx-core
    implementation 'io.github.skylot:jadx-core:1.5.4'

    // jadx-core is the decompiler engine only; jadx-dex-input registers the
    // ServiceLoader-based reader for DEX files and their wrappers (APK, ZIP).
    // Without this, JadxDecompiler.load() finds no classes when given an APK.
    // mergeServiceFiles() in shadowJar ensures the registration survives JAR merging.
    implementation 'io.github.skylot:jadx-dex-input:1.5.4'

    // https://central.sonatype.com/artifact/org.eclipse.lsp4j/org.eclipse.lsp4j
    implementation 'org.eclipse.lsp4j:org.eclipse.lsp4j:0.24.0'

    // Routes jadx-core's SLF4J logging to stderr so it doesn't touch stdout.
    implementation 'org.slf4j:slf4j-simple:2.0.17'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Integration test dependencies
    integrationTestImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    integrationTestImplementation 'org.mockito:mockito-core:5.11.0'
    integrationTestImplementation 'org.eclipse.lsp4j:org.eclipse.lsp4j:0.24.0'
    integrationTestImplementation 'com.google.code.gson:gson:2.10.1'
    integrationTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    integrationTestRuntimeOnly 'io.github.skylot:jadx-dex-input:1.5.4'
}

test {
    useJUnitPlatform()
}

task integrationTest(type: Test) {
    useJUnitPlatform()
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter test
}

// jadx-dex-input has a transitive dependency on smali-baksmali, which lives on
// dl.google.com (Google Maven). That host is not required for any test we run,
// so exclude it from the test classpath to keep `gradle test` self-contained.
// The shadowJar task still bundles jadx-dex-input via runtimeClasspath.
configurations.testRuntimeClasspath {
    exclude group: 'io.github.skylot', module: 'jadx-dex-input'
}

// Same for integration tests
configurations.integrationTestRuntimeClasspath {
    exclude group: 'com.android.tools.smali', module: 'smali-baksmali'
}

jar {
    manifest {
        attributes 'Main-Class': 'jadx.lsp.Main'
    }
}

shadowJar {
    archiveBaseName.set('jadx-lsp')
    archiveVersion.set('')
    archiveClassifier.set('')
    mergeServiceFiles()  // merges META-INF/services so jadx's plugin loader works
}

build.dependsOn shadowJar

// Task to run the server (for manual testing)
// Usage: gradle -p server runServer -Djadx.file=/path/to/app.apk
task runServer(type: JavaExec) {
    group = "jadx"
    description = "Start the jadx-lsp server (for manual testing)"
    classpath = files(shadowJar.archiveFile)
    mainClass = 'jadx.lsp.Main'

    def jadxFile = System.getProperty('jadx.file')
    if (jadxFile) {
        args '--jadxFile=' + jadxFile
    }

    standardInput = System.in
    standardOutput = System.out
    errorOutput = System.err
}

// Task to run E2E tests
// This calls the bash script at the repo root
task e2eTest(type: Exec) {
    group = "verification"
    description = "Run end-to-end plugin tests"

    def repoRoot = project.rootDir.parentFile
    commandLine "bash", repoRoot.absolutePath + "/run_e2e_tests.sh"

    dependsOn shadowJar
}
